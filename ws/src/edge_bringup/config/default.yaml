sensor_source:
  ros__parameters:
    imu_hz: 100.0
    gnss_hz: 5.0
    lidar_hz: 10.0
    odom_hz: 50.0
    speed_mps: 8.0
    imu_topic: /imu/data
    gnss_topic: /gnss/fix
    lidar_topic: /lidar
    odom_topic: /odom
    sim_odom_topic: /sim/ground_truth/odom
    frame_base: base_link
    frame_imu: imu_link
    frame_lidar: lidar_link
    frame_map: map
    publish_tf: true

edge_processor:
  ros__parameters:
    lidar_topic: /lidar
    processed_lidar_topic: /edge/lidar/processed
    edge_status_topic: /edge/status
    max_points: 2000
    z_min: -1.0
    z_max: 5.0
